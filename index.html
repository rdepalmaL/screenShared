<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HuskySharedScreen</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #111; 
      color: #eee; 
      margin: 0; 
      padding: 0; 
    }
    h1 { color: #4cafef; padding: 20px 20px 0 20px; margin: 0; }
    p { padding: 0 20px; }
    #video-container {
      margin: 20px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      height: 520px;
    }
    #streams { margin-top: 20px; padding: 0 20px; }
    .stream-item { margin: 10px 0; }
    a { color: #4cafef; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; padding: 20px; text-align: center; background: #222; }
    footer a { margin: 0 10px; color: #aaa; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <h1>HuskySharedScreen</h1>
  <p>Compartilhamento de tela automático em 1080p.</p>

  <div id="video-container"></div>

  <div id="streams">
    <h2>Streams ativos:</h2>
    <div id="stream-list"></div>
  </div>

  <script type="module">
    import { ActivitySDK } from "https://cdn.skypack.dev/@discord/activities-sdk";

    const sdk = new ActivitySDK();

    sdk.ready().then(() => {
      const randomId = Math.floor(100000 + Math.random() * 900000);
      const streamId = "husky_" + randomId;

      // Parâmetros para forçar exibição do botão de compartilhamento no VDO Ninja
      const pushLink = `/vdo/?push=${streamId}&screenshare&screensharebutton&quality=9&fps=60&width=1920&height=1080`;
      const viewLink = `/vdo/?view=${streamId}&videobitrate=10000&scale=100`;

      const container = document.getElementById("video-container");
      
      const iframe = document.createElement("iframe");
      iframe.src = pushLink;
      iframe.width = "100%";
      iframe.height = "100%";
      iframe.allow = "camera *; microphone *; display-capture *; autoplay *";
      iframe.style.border = "none";
      
      container.appendChild(iframe);

      const list = document.getElementById("stream-list");
      const item = document.createElement("div");
      item.className = "stream-item";
      item.innerHTML = `<a href="${viewLink}" target="_blank">Assistir stream (${streamId})</a>`;
      list.appendChild(item);
    });
  </script>

  <footer>
    <p>
      <a href="privacidade.html" target="_blank">Política de Privacidade</a> | 
      <a href="termos.html" target="_blank">Termos de Serviço</a>
    </p>
  </footer>
</body>
</html>
