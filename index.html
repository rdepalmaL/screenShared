<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HuskySharedScreen</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; padding: 0; }
    h1 { color: #4cafef; padding: 20px 20px 0; margin: 0; }
    p { padding: 0 20px; }
    #video-container { margin: 20px; background: #000; border-radius: 8px; overflow: hidden; height: 520px; }
    #streams { margin-top: 20px; padding: 0 20px; }
    .stream-item { margin: 10px 0; }
    a { color: #4cafef; text-decoration: none; }
    footer { margin-top: 40px; padding: 20px; text-align: center; background: #222; }
    footer a { margin: 0 10px; color: #aaa; }
    .controls { display: flex; gap: 12px; align-items: center; }
    button { margin: 20px; padding: 12px 20px; background: #4cafef; color: #111; font-weight: bold; border: 0; border-radius: 6px; cursor: pointer; }
    #stop-btn { background: #d14d4d; color: white; display: none; }
    #stop-btn.visible { display: inline-block; }
  </style>
</head>
<body>
  <h1>HuskySharedScreen</h1>
  <p>Compartilhamento de tela automático em 1080p.</p>

  <div class="controls">
    <button id="share-btn">SELECT SCREEN TO SHARE</button>
    <button id="stop-btn">PARAR COMPARTILHAMENTO</button>
  </div>

  <div id="video-container"></div>

  <div id="streams">
    <h2>Streams ativos:</h2>
    <div id="stream-list"></div>
  </div>

  <script>
    const container = document.getElementById("video-container");
    const list = document.getElementById("stream-list");
    const shareBtn = document.getElementById("share-btn");
    const stopBtn = document.getElementById("stop-btn");

    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const wsBase = window.SCREEN_SHARED_WS_URL || `${protocol}://${location.host}`;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    let currentStream = null;
    let currentPc = null;
    let currentWs = null;
    let currentStreamId = null;

    function stopSharing() {
      if (currentWs && currentWs.readyState === WebSocket.OPEN) {
        currentWs.send(JSON.stringify({ publisherStopped: true }));
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      if (currentPc) {
        currentPc.close();
      }

      if (currentWs) {
        currentWs.close();
      }

      currentStream = null;
      currentPc = null;
      currentWs = null;
      currentStreamId = null;

      container.innerHTML = "";
      shareBtn.disabled = false;
      stopBtn.classList.remove("visible");
      shareBtn.textContent = "SELECT SCREEN TO SHARE";
    }

    stopBtn.addEventListener("click", () => {
      stopSharing();
    });

    shareBtn.addEventListener("click", async () => {
      if (currentWs || currentPc || currentStream) {
        stopSharing();
        return;
      }

      try {
        shareBtn.disabled = true;
        const media = await navigator.mediaDevices.getDisplayMedia({
          video: { width: 1920, height: 1080, frameRate: 60 },
          audio: true
        });

        currentStreamId = `husky_${Math.floor(100000 + Math.random() * 900000)}`;
        currentStream = media;
        currentPc = new RTCPeerConnection(rtcConfig);
        const pendingCandidates = [];
        let wsOpen = false;
        const pendingMessages = [];

        media.getTracks().forEach(track => {
          currentPc.addTrack(track, media);
          track.addEventListener("ended", () => {
            if (currentWs && currentWs.readyState === WebSocket.OPEN) {
              currentWs.send(JSON.stringify({ publisherStopped: true }));
            }
            stopSharing();
          });
        });

        currentWs = new WebSocket(`${wsBase}/api/vdo?stream=${encodeURIComponent(currentStreamId)}&role=publisher`);

        const send = (message) => {
          if (wsOpen) {
            currentWs.send(JSON.stringify(message));
          } else {
            pendingMessages.push(message);
          }
        };

        currentWs.onopen = () => {
          wsOpen = true;
          while (pendingMessages.length) {
            currentWs.send(JSON.stringify(pendingMessages.shift()));
          }
        };

        currentWs.onerror = () => {
          alert("Não foi possível conectar ao servidor de sinalização.");
          stopSharing();
        };

        currentWs.onmessage = async ({ data }) => {
          const message = JSON.parse(data);
          if (message.answer) {
            await currentPc.setRemoteDescription(message.answer);
            while (pendingCandidates.length) {
              await currentPc.addIceCandidate(pendingCandidates.shift());
            }
          }

          if (message.candidate) {
            if (currentPc.remoteDescription) {
              await currentPc.addIceCandidate(message.candidate);
            } else {
              pendingCandidates.push(message.candidate);
            }
          }
        };

        currentPc.onicecandidate = ({ candidate }) => {
          if (candidate) send({ candidate });
        };

        const offer = await currentPc.createOffer();
        await currentPc.setLocalDescription(offer);
        send({ offer });

        const video = document.createElement("video");
        video.srcObject = media;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.style.width = "100%";
        video.style.height = "100%";
        container.innerHTML = "";
        container.appendChild(video);

        const item = document.createElement("div");
        item.className = "stream-item";
        const link = `${location.origin}/viewer.html?view=${currentStreamId}`;
        item.innerHTML = `<a href="${link}" target="_blank">Assistir stream (${currentStreamId})</a>`;
        list.appendChild(item);

        shareBtn.textContent = "COMPARTILHANDO...";
        stopBtn.classList.add("visible");
      } catch (error) {
        alert("Erro ao iniciar compartilhamento: " + error.message);
        stopSharing();
      }
    });
  </script>

  <footer>
    <p>
      <a href="privacidade.html" target="_blank">Política de Privacidade</a> | 
      <a href="termos.html" target="_blank">Termos de Serviço</a>
    </p>
  </footer>
</body>
</html>
