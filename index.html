Para resolver este problema onde a transmissão/atividade do Discord não carrega ou fica em ecrã preto, siga estes passos simples:

<Steps>
  <Step title="Reiniciar a Atividade no Discord" subtitle="1 min">
    Encerre a atividade **HuskySharedScreen** clicando no botão de desligar a transmissão/atividade (no canto inferior esquerdo, perto do nome do canal de voz) e inicie-a novamente.
  </Step>
  <Step title="Verificar Permissões do Bot/App" subtitle="1 min">
    Garanta que a aplicação/bot tem as permissões necessárias no canal de voz (como permissão para transmitir vídeo/ecrã e utilizar atividades).
  </Step>
  <Step title="Desativar a Aceleração de Hardware" subtitle="2 min">
    Vá às **Definições do Utilizador** (ícone de engrenagem) > **Avançado** > desative a opção **Aceleração de Hardware** e reinicie o Discord.
  </Step>
  <Step title="Executar o Discord como Administrador" subtitle="1 min">
    Feche o Discord completamente na bandeja do sistema, clique com o botão direito no ícone do Discord no ambiente de trabalho e selecione **Executar como administrador**.
  </Step>
</Steps>

Para confirmar se o passo funcionou, verifique se a transmissão do ecrã ou do jogo passa a aparecer na área central por baixo de "Streams ativos"[cite: 1].
