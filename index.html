<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HuskySharedScreen</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; padding: 0; }
    h1 { color: #4cafef; }
    #streams { margin-top: 20px; }
    .stream-item { margin: 10px 0; }
    a { color: #4cafef; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; padding: 20px; text-align: center; background: #222; }
    footer a { margin: 0 10px; color: #aaa; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <h1>HuskySharedScreen</h1>
  <p>Compartilhamento de tela automático em 1080p.</p>

  <div id="streams">
    <h2>Streams ativos:</h2>
    <div id="stream-list"></div>
  </div>

  <script type="module">
    import { ActivitySDK } from "https://cdn.skypack.dev/@discord/activities-sdk";

    const sdk = new ActivitySDK();

    sdk.ready().then(() => {
      const userId = sdk.userId;
      const streamId = "husky_" + userId;

      const pushLink = `https://vdo.ninja/?push=${streamId}&screen&quality=9&fps=60&width=1920&height=1080`;
      const viewLink = `https://vdo.ninja/?view=${streamId}&videobitrate=10000&scale=100`;

      // Abre o iframe com o compartilhamento de tela
      sdk.activities.openIframe(pushLink);

      // Adiciona o link de visualização à lista
      const list = document.getElementById("stream-list");
      const item = document.createElement("div");
      item.className = "stream-item";
      item.innerHTML = `<a href="${viewLink}" target="_blank">Assistir stream de ${userId}</a>`;
      list.appendChild(item);

      console.log("Stream ativo:", viewLink);
    });
  </script>

  <footer>
    <p>
      <a href="privacidade.html" target="_blank">Política de Privacidade</a> | 
      <a href="termos.html" target="_blank">Termos de Serviço</a>
    </p>
  </footer>
</body>
</html>
