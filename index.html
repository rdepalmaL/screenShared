<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HuskySharedScreen</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #111; 
      color: #eee; 
      margin: 0; 
      padding: 0; 
    }
    h1 { color: #4cafef; padding: 20px 20px 0 20px; margin: 0; }
    p { padding: 0 20px; }
    #video-container {
      margin: 20px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      height: 550px;
    }
    #streams { margin-top: 20px; padding: 0 20px; }
    .stream-item { margin: 10px 0; }
    a { color: #4cafef; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; padding: 20px; text-align: center; background: #222; }
    footer a { margin: 0 10px; color: #aaa; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <h1>HuskySharedScreen</h1>
  <p>Compartilhamento de tela automático em 1080p.</p>

  <div id="video-container"></div>

  <div id="streams">
    <h2>Streams ativos:</h2>
    <div id="stream-list"></div>
  </div>

  <script type="module">
    import { ActivitySDK } from "https://cdn.skypack.dev/@discord/activities-sdk";

    const sdk = new ActivitySDK();

    sdk.ready().then(() => {
      // Gera um ID único para a sessão sem depender do comando authenticate
      const randomId = Math.floor(100000 + Math.random() * 900000);
      const streamId = "husky_" + randomId;

      const pushLink = `/vdo/?push=${streamId}&screen&quality=9&fps=60&width=1920&height=1080`;
      const viewLink = `/vdo/?view=${streamId}&videobitrate=10000&scale=100`;

      const container = document.getElementById("video-container");
      
      // Cria e insere o iframe do VDO Ninja
      const iframe = document.createElement("iframe");
      iframe.src = pushLink;
      iframe.width = "100%";
      iframe.height = "100%";
      iframe.allow = "camera; microphone; display-capture; autoplay";
      iframe.style.border = "none";
      
      container.appendChild(iframe);

      // Adiciona o linkO Discord está preso no ecrã de carregamento ("Carregando transmissão...") ao tentar visualizar a partilha de ecrã[cite: 1]. Este problema geralmente é causado por definições de aceleração por hardware, cache corrompida ou bloqueios no protocolo de rede/AV1.

Siga estes passos para resolver o problema:

<Steps>
  <Step title="Desativar Aceleração por Hardware" subtitle="2 min">
    Vá às **Definições do Utilizador** (ícone de engrenagem no canto inferior esquerdo) > **Avançado** > Desative a opção **Aceleração por Hardware**. Reinicie o Discord.
    
    *Verificação:* Abra novamente a transmissão para testar se a imagem carrega imediatamente.
  </Step>

  <Step title="Desativar Códecs de Vídeo Avançados" subtitle="1 min">
    Vá às **Definições do Utilizador** > **Voz e Vídeo**. Na secção "Códecs de Vídeo", desative o **Codec de Vídeo AV1** e a **Aceleração por Hardware H.264**.
    
    *Verificação:* Entre novamente no canal de voz e clique para assistir à transmissão.
  </Step>

  <Step title="Limpar a Cache do Discord" subtitle="3 min">
    Feche completamente o Discord (botão direito no ícone da barra de tarefas > Sair do Discord). Pressione `Win + R`, digite `%appdata%\discord` e prima Enter. Apague as pastas `Cache`, `Code Cache` e `GPUCache`.
    
    *Verificação:* Abra o Discord novamente e tente visualizar a partilha de ecrã.
  </Step>

  <Step title="Mudar de Servidor de Voz" subtitle="1 min">
    Se for administrador do servidor do Discord, vá às definições do canal de voz e altere a **Região do Servidor** (Override de Região) para outra localização e volte a testar.
    
    *Verificação:* O stream recarregará automaticamente para todos no canal.
  </Step>
</Steps>

Se o problema persistir após estes passos, qual é a versão do seu sistema operacional (ex: Windows 10, Windows 11) e está a utilizar a aplicação do Discord ou a versão web no browser?
